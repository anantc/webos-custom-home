[package]
name = "tvhome"
version = "0.1.7"
edition = "2021"
license = "MIT"
description = "Pair, sync and monitor native Home on LG webOS"

[[bin]]
name = "tvhome"
path = "src/main.rs"

[features]
# Bundle the C libraries used by SSH; macOS HTTP uses system TLS.
portable = ["native-tls/vendored", "openssl/vendored", "libz-sys/static"]
bundled-home = []

[dependencies]
ssh2 = "0.9"
libz-sys = "1"
openssl = "0.10"
rpassword = "7"
base64 = "0.22"
sha2 = "0.10"
ar = "0.9"
tar = "0.4"
flate2 = "1"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2"
native-tls = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process", "signal", "io-util", "test-util"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }

[dev-dependencies]
plist = "1"
