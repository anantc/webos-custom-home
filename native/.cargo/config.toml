# webOS TV cross target, adapted from Punktfunk. See docs/DEVELOPMENT.md.
[target.armv7-unknown-linux-gnueabi]
linker = "scripts/cc-shim.sh"
# Retain the soft-float calling convention, but emit hardware VFP/NEON instructions.
# Cortex-A7 is a conservative ARMv7 baseline, not a claim about this TV's exact CPU.
# The prebuilt Skia library has its own compiler settings.
# Use the kernel syscall for randomness: older webOS libc lacks getrandom,
# and the app sandbox may not expose /dev/urandom.
rustflags = [
    "-C",
    "target-feature=+neon,+vfp3,-soft-float",
    "-C",
    "target-cpu=cortex-a7",
    "--cfg",
    'getrandom_backend="linux_raw"',
]

[env]
CC_armv7_unknown_linux_gnueabi = { value = "scripts/cc-shim.sh", relative = true }
CXX_armv7_unknown_linux_gnueabi = { value = "scripts/cxx-shim.sh", relative = true }
AR_armv7_unknown_linux_gnueabi = { value = ".toolchains/arm-webos-linux-gnueabi_sdk-buildroot/bin/arm-webos-linux-gnueabi-gcc-ar", relative = true }
PKG_CONFIG_ALLOW_CROSS_armv7_unknown_linux_gnueabi = "1"
PKG_CONFIG_SYSROOT_DIR_armv7_unknown_linux_gnueabi = { value = ".toolchains/arm-webos-linux-gnueabi_sdk-buildroot/arm-webos-linux-gnueabi/sysroot", relative = true }
PKG_CONFIG_LIBDIR_armv7_unknown_linux_gnueabi = { value = ".toolchains/arm-webos-linux-gnueabi_sdk-buildroot/arm-webos-linux-gnueabi/sysroot/usr/lib/pkgconfig", relative = true }
